<h2>Watchlist {{ watchlist_id }}</h2>
<form method="POST" action="{{ url_for('add_stock_to_watchlist', watchlist_id=watchlist_id) }}">
    <input type="text" name="stock_name" placeholder="Stock symbol" required>
    <button type="submit">Add Stock</button>
</form>

<ul class="list-group">
    {% for s in stocks %}
        <li class="list-group-item d-flex justify-content-between align-items-center">
            <a href="{{ url_for('stock_details', stock_name=s[0]) }}" class="text-decoration-none">
                {{ s[0] }}
            </a>
            <a href="{{ url_for('remove_stock', watchlist_id=watchlist_id, stock_name=s[0]) }}" class="btn btn-sm btn-danger">Remove</a>
        </li>
    {% endfor %}
    </ul>
