<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Stock Watchlist - StockSense</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
    <style>
        :root {
            --dark-bg: #0d1117;
            --card-bg: #161b22;
            --accent: #22c55e;
            --text: #e6edf3;
            --muted: #8b949e;
        }

        body {
            background-color: var(--dark-bg);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: var(--text);
            margin: 0;
            padding: 0;
        }

        .watchlist-container {
            max-width: 700px;
            margin: 60px auto 30px;
            background-color: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
            padding: 30px;
        }

        h2 {
            color: var(--text);
            font-weight: 600;
        }

        .form-control {
            background-color: var(--dark-bg);
            border: 1px solid #30363d;
            color: var(--text);
        }

        .form-control::placeholder {
            color: var(--muted);
        }

        .form-control:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 0.2rem rgba(34, 197, 94, 0.15);
        }

        .btn-success {
            background-color: var(--accent);
            border: none;
        }

        .btn-success:hover {
            background-color: #16a34a;
        }

        .list-group-item {
            background-color: var(--dark-bg);
            color: var(--text);
            border: 1px solid #30363d;
        }

        .stock-item a {
            font-weight: 500;
            color: var(--text);
        }

        .stock-item a:hover {
            text-decoration: underline;
        }

        .btn-outline-danger {
            border-color: #ef4444;
            color: #ef4444;
        }

        .btn-outline-danger:hover {
            background-color: #ef4444;
            color: white;
        }

        .btn-outline-secondary {
            border-color: var(--muted);
            color: var(--muted);
        }

        .btn-outline-secondary:hover {
            background-color: #1f2937;
            color: white;
        }

        .text-center a {
            margin-top: 1rem;
        }
    </style>
</head>
<body>
    <div class="watchlist-container">
        <h2 class="mb-4"><i class="fas fa-eye"></i> Watchlist</h2>

        <form method="POST" action="{{ url_for('add_stock_to_watchlist') }}" class="d-flex mb-4 gap-2">
            <select name="stock_name" class="form-select" required>
                <option value="" disabled selected>Select Stock</option>
                {% for stock in all_stocks %}
                <option value="{{ stock[0] }}">{{ stock[0] }}</option>
                {% endfor %}
            </select>
        
            <input type="hidden" name="watchlist_id" value="{{ watchlist_id }}">
            <button type="submit" class="btn btn-success">
                <i class="fas fa-plus"></i> Add
            </button>
        </form>
        
        

        <ul class="list-group">
            {% for s in stocks %}
            <li class="list-group-item d-flex justify-content-between align-items-center stock-item">
                <a href="{{ url_for('stock_details', stock_name=s[0]) }}" class="text-decoration-none">
                    <i class="fas fa-chart-line me-2 text-success"></i>{{ s[0] }}
                </a>
                <a href="{{ url_for('remove_stock', watchlist_id=watchlist_id, stock_name=s[0]) }}" class="btn btn-sm btn-outline-danger">
                    <i class="fas fa-trash-alt"></i> Remove
                </a>
            </li>
            {% endfor %}
        </ul>
    </div>

    <div class="text-center">
        <a href="{{ url_for('index') }}" class="btn btn-outline-secondary">
            ⬅ Back to Dashboard
        </a>
    </div>
</body>
</html>
