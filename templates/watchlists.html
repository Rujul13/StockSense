<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Watchlists</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            padding: 2rem;
            background-color: #f8f9fa;
        }
        .watchlist-card {
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            border-radius: 10px;
        }
    </style>
</head>
<body>
<div class="container">
    <h2 class="mb-4 text-primary">📋 My Watchlists</h2>

    <!-- Create New Watchlist -->
    <form method="POST" action="{{ url_for('create_watchlist') }}" class="d-flex mb-4">
        <input type="text" name="name" class="form-control me-2" placeholder="New watchlist name" required>
        <button type="submit" class="btn btn-success">+ Create</button>
    </form>

    <!-- Watchlists Grid -->
    <div class="row">
        {% for w in watchlists %}
        <div class="col-md-4 mb-4">
            <div class="card watchlist-card p-3">
                <h5>{{ w[1] }}</h5>
                <a href="{{ url_for('view_watchlist_stocks', watchlist_id=w[0]) }}" class="btn btn-outline-primary btn-sm mt-2">View Stocks</a>
                <!-- Optional: buttons to delete/rename -->
            </div>
        </div>
        {% endfor %}
    </div>

    <a href="{{ url_for('index') }}" class="btn btn-outline-secondary mt-4">⬅ Back to Dashboard</a>
</div>
</body>
</html>
