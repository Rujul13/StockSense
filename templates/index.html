<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>StockSense Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
  <style>
    :root {
      --dark-bg: #0d1117;
      --card-bg: #161b22;
      --accent: #22c55e;
      --text: #e6edf3;
      --muted: #8b949e;
    }

    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background-color: var(--dark-bg);
      color: var(--text);
    }

    .sidebar {
      width: 270px;
      height: 100vh;
      background: var(--card-bg);
      position: fixed;
      top: 0;
      left: 0;
      display: flex;
      flex-direction: column;
      padding: 2rem 1.2rem;
      border-right: 1px solid #222;
    }

    .sidebar h2 {
      color: var(--accent);
      font-weight: 700;
      margin-bottom: 2rem;
      font-size: 1.6rem;
      text-align: center;
    }

    .sidebar label {
      font-weight: 500;
      margin-top: 1.5rem;
      margin-bottom: 0.5rem;
    }

    .sidebar select,
    .sidebar input[type="text"] {
      width: 100%;
      padding: 0.55rem;
      border-radius: 8px;
      background-color: #0d1117;
      border: 1px solid #30363d;
      color: var(--text);
    }

    .sidebar select:focus,
    .sidebar input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 0.15rem rgba(34, 197, 94, 0.3);
    }

    .sidebar button {
      margin-top: 0.75rem;
      background-color: var(--accent);
      color: var(--dark-bg);
      border: none;
      padding: 0.5rem 1rem;
      border-radius: 6px;
      font-weight: 500;
      cursor: pointer;
      width: 100%;
    }

    .sidebar button:hover {
      background-color: #16a34a;
    }

    .topbar {
      position: fixed;
      top: 0;
      left: 270px;
      right: 0;
      height: 60px;
      background: var(--card-bg);
      border-bottom: 1px solid #222;
      display: flex;
      justify-content: flex-end;
      align-items: center;
      padding: 0 1.5rem;
      z-index: 1000;
    }

    .logout-btn {
      background: none;
      border: 1px solid #ef4444;
      color: #ef4444;
      padding: 0.4rem 0.9rem;
      border-radius: 6px;
      font-size: 0.9rem;
      transition: 0.3s;
      text-decoration: none;
    }

    .logout-btn:hover {
      background-color: #ef4444;
      color: var(--dark-bg);
    }

    .main-content {
      margin-left: 270px;
      padding: 80px 2rem 2rem;
    }

    iframe {
      width: 100%;
      height: 70vh;
      border: none;
      border-radius: 12px;
      background: var(--card-bg);
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
    }

    .card-soft {
      background-color: #1e293b;
    }

    #alert-box {
      position: fixed;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1050;
      display: none;
    }

    @media (max-width: 768px) {
      .sidebar {
        width: 100%;
        height: auto;
        position: relative;
        border-right: none;
        border-bottom: 1px solid #333;
      }

      .topbar,
      .main-content {
        margin-left: 0;
        padding: 1rem;
      }
    }
  </style>
</head>
<body>

  <!-- Sidebar -->
  <div class="sidebar">
    <h2>StockSense</h2>

    <label for="stock-select">Select Stock</label>
    <select id="stock-select" onchange="loadStockPage(this)">
      <option value="" disabled selected>Select a stock</option>
      {% for stock in stocks %}
        <option value="{{ url_for('stock_details', stock_name=stock[0]) }}">{{ stock[0] }}</option>
      {% endfor %}
    </select>

    {% if 'username' in session %}
      <label for="watchlist-name">New Watchlist</label>
      <form id="watchlist-form" method="POST" action="{{ url_for('create_watchlist') }}">
        <input type="text" name="name" id="watchlist-name" placeholder="Watchlist name" required />
        <button type="submit">+ Create</button>
      </form>

      <a href="{{ url_for('view_all_watchlists') }}" class="btn btn-outline-info mt-3 w-100">📋 View My Watchlists</a>
    {% endif %}
  </div>

  <!-- Top Bar -->
  <div class="topbar">
    {% if 'username' in session %}
      <a href="{{ url_for('main') }}" class="logout-btn">Logout</a>
    {% endif %}
  </div>

  <!-- Alert Box -->
  <div id="alert-box" class="alert alert-success shadow" role="alert">
    <!-- Will be filled dynamically -->
  </div>

  <!-- Main Content -->
  <div class="main-content">
    <div class="header">
      <h3>Stock Overview</h3>
    </div>

    <!-- Default Summary Section -->
    <div class="row g-3 mb-4 text-center">
  <div class="col-md-3">
    <div class="card-soft p-3 rounded shadow-sm text-white">
      <small style="color: #9ca3af;">Total Stocks</small>
      <h4>{{ stocks|length }}</h4>
    </div>
  </div>
  <div class="col-md-3">
    <div class="card-soft p-3 rounded shadow-sm text-white">
      <small style="color: #9ca3af;">Top Gainers</small>
      <h4 class="text-success">AAPL, BDX</h4>
    </div>
  </div>
  <div class="col-md-3">
    <div class="card-soft p-3 rounded shadow-sm text-white">
      <small style="color: #9ca3af;">Top Losers</small>
      <h4 class="text-danger">CRM, AMZN</h4>
    </div>
  </div>
  <div class="col-md-3">
    <div class="card-soft p-3 rounded shadow-sm text-white">
      <small style="color: #9ca3af;">Data Updated</small>
      <h4>{{ last_updated }}</h4>
    </div>
  </div>
</div>


    <!-- Iframe -->
    <iframe id="stock-frame" src="" style="display: none;"></iframe>
  </div>

  <!-- JS -->
  <script>
    function loadStockPage(select) {
      const iframe = document.getElementById('stock-frame');
      const defaultSection = document.getElementById('default-overview');

      if (select.value) {
        iframe.src = select.value;
        iframe.style.display = "block";
        defaultSection.style.display = "none";
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      const iframe = document.getElementById('stock-frame');
      const defaultSection = document.getElementById('default-overview');

      if (!iframe.src || iframe.src === window.location.href) {
        iframe.style.display = "none";
        defaultSection.style.display = "block";
      }

      // Watchlist form success alert
      const form = document.getElementById('watchlist-form');
      const input = document.getElementById('watchlist-name');
      const alertBox = document.getElementById('alert-box');

      form.addEventListener('submit', function (e) {
        e.preventDefault(); // Prevent immediate form submission
        const watchlistName = input.value.trim();
        if (watchlistName) {
          alertBox.textContent = `✅ Watchlist "${watchlistName}" created!`;
          alertBox.style.display = 'block';
          setTimeout(() => {
            alertBox.style.display = 'none';
            form.submit(); // Submit after showing the message
          }, 1000);
        }
      });
    });
  </script>
</body>
</html>
