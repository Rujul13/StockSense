<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{{ stock_name }} - Statistics</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <!-- ✅ Chart.js and financial plugin -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.3.0/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-chart-financial@3.3.0/dist/chartjs-chart-financial.min.js"></script>

  <style>
    canvas {
      background: #fff;
      border: 1px solid #ddd;
      padding: 10px;
    }
  </style>
</head>
<body class="container mt-5">

  <h1 class="text-primary">{{ stock_name }} - Statistics</h1>

  <ul class="list-group my-4">
    <li class="list-group-item">Average Close Price: <strong>{{ avg_close }}</strong></li>
    <li class="list-group-item">Highest High: <strong>{{ high_max }}</strong></li>
    <li class="list-group-item">Lowest Low: <strong>{{ low_min }}</strong></li>
    <li class="list-group-item">Total Volume Traded: <strong>{{ total_volume }}</strong></li>
  </ul>

  <h3 class="mb-3">Candlestick Chart</h3>
  <canvas id="candlestickChart" width="1000" height="400"></canvas>
  <!-- ✅ Chart script -->
  <script>
    const ctx = document.getElementById('candlestickChart').getContext('2d');

    const data = {
      datasets: [{
        label: '{{ stock_name }}',
        data: {{ candlestick_data | tojson }},
        borderColor: 'rgba(0, 0, 0, 0.1)'
      }]
    };

    const config = {
      type: 'candlestick',
      data: data,
      options: {
        responsive: true,
        scales: {
          x: {
            ticks: {
              callback: function(value, index, ticks) {
                return this.getLabelForValue(value).split('T')[0]; // Only show date
              }
            }
          },
          y: {
            beginAtZero: false,
            title: {
              display: true,
              text: 'Price'
            }
          }
        }
      }
    };

    new Chart(ctx, config);
  </script>

</body>
</html>
